services:
  - type: web
    name: auren-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_API_KEY
        sync: false
      - key: BASE_RPC_URL
        value: https://mainnet.base.org

  - type: web
    name: auren-web
    runtime: node
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: https://auren-api-8yrq.onrender.com
      - key: RISK_API_URL
        value: https://auren-api-8yrq.onrender.com/risk
      - key: LIQUIDITY_API_URL
        value: https://auren-api-8yrq.onrender.com/liquidity
      - key: WALLET_API_URL
        value: https://auren-api-8yrq.onrender.com/wallet